server {
  listen 8080;
  server_name _;
  default_type application/json;

  # The relay is the only cross-network callback path. It exposes no catch-all
  # proxy and preserves only the bridge token needed by the Admin endpoints.
  location = /api/v1/iii-collections/lifecycle {
    proxy_set_header X-III-Bridge-Token $http_x_iii_bridge_token;
    proxy_pass http://proof-admin:8000;
  }
  location = /api/v1/iii-collections/expected-key-reports {
    proxy_set_header X-III-Bridge-Token $http_x_iii_bridge_token;
    proxy_pass http://proof-admin:8000;
  }
  location = /api/v1/iii-collections/ingress-receipts {
    proxy_set_header X-III-Bridge-Token $http_x_iii_bridge_token;
    proxy_pass http://proof-admin:8000;
  }
  location / { return 404; }
}
