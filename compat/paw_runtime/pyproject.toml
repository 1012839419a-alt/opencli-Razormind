[project]
name = "opencli-paw-runtime"
version = "0.4.4"
description = "Offline fixed-program PAW enrichment sidecar for OpenCLI Admin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "llama-cpp-python==0.3.19",
    "programasweights==0.4.4",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]


[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
