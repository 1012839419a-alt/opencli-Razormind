[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencli-kats-runtime"
version = "0.1.0"
description = "Pinned Kats compatibility sidecar for OpenCLI Admin"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.103.2",
    "pydantic==1.10.24",
    "uvicorn==0.23.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.extra-build-dependencies]
fbprophet = ["setuptools<81", "cython<3", "numpy==1.21.6"]
pystan = ["setuptools<81", "cython<3", "numpy==1.21.6"]
